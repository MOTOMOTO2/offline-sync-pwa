<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the bottom bar can sit inside the home indicator inset -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Field Reports: site list, detail and filing a report, usable with no signal." />

    <title>Field Reports</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Field Reports" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      Served by the Python app, not bundled: it decides at boot which API this
      installed client talks to. Missing or stale is survivable, the app falls
      back to the same origin.
    -->
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Field Reports needs JavaScript: the offline cache and the outbox both run in the browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
